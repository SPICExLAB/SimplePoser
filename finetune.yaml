# reproducibility
seed: 42

# training
device: cuda:0
batch_size: 32
num_epochs: 10
learning_rate: 0.001
num_workers: 0
dropout: 0.4

# data configs
dataset: IMUPoser
add_noise: true

# output directory
output_dir: checkpoints

# model config
target_fps: 30
past_frames: 40
future_frames: 5
use_r6d_input: false
total_frames: past_frames + future_frames
pretrained: checkpoints/dynaip_nymeria_finetune/finetune/best.pt

# settings
use_global_pose: true
window_length: 300

# wandb
wandb_project: SimplePoser
wandb_run_name: dynaip_nymeria_finetune_imuposer
wandb_group: dynaip
