# reproducibility
seed: 42

# training
device: cuda:0
batch_size: 32
num_epochs: 15
learning_rate: 0.0001
num_workers: 0
dropout: 0.4

# data configs
dataset: IMUPoser
add_noise: false

# output directory
output_dir: checkpoints

# model config
target_fps: 30
past_frames: 40
future_frames: 5
use_r6d_input: false
total_frames: past_frames + future_frames
pretrained: checkpoints/global_rp_calib_noise/best.pt

# settings
use_global_pose: true
window_length: 150

use_semoae: false

# wandb
wandb_project: SimplePoser
wandb_run_name: global_rp_calib_noise
wandb_group: rightpocket
