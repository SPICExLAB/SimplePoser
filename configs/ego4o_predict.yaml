# reproducibility
seed: 42

# device
device: cuda:0

# data
dataset: IMUPoser
target_fps: 30
window_length: 128
feet_thre: 0.002
eval_batch_size: 1
num_workers: 0

# IMU encoder architecture (must match training)
input_dim: 9
sensor_num: 6
codes_realLength: 4
model_dim1: 512
model_dim2: 256
nhead: 4
num_encoder_layers: 4
num_decoder_layers: 3
dropout: 0.1

# VQ-VAE architecture (must match training)
nb_code: 512
code_dim: 512
output_emb_width: 512
down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
mu: 0.99

# checkpoints
vqvae_checkpoint: checkpoints/ego4o_vqvae/best.pt
encoder_checkpoint: checkpoints/ego4o_encoder/best.pt

# TTO settings (matching official defaults)
use_tto: false
tto:
  lr: 0.5
  max_iter: 50
  history_size: 20
  acc_weight: 0.0

# output
output_dir: results/ego4o
save_results: false
