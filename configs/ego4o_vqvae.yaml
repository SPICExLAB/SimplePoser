# reproducibility
seed: 42

# training
device: cuda:0
batch_size: 128
num_epochs: 30
learning_rate: 0.0001
num_workers: 4

# data
dataset: Train
target_fps: 30
window_length: 128
feet_thre: 0.002

# VQ-VAE architecture
nb_code: 512
code_dim: 512
output_emb_width: 512
down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
mu: 0.99
commit_weight: 0.001

# output
output_dir: checkpoints

# wandb
wandb_project: SimplePoser
wandb_run_name: ego4o_vqvae
wandb_group: ego4o
