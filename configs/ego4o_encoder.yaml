# reproducibility
seed: 42

# training
device: cuda:0
batch_size: 128
num_epochs: 25
learning_rate: 0.0001
num_workers: 4

# data
dataset: IMUPoser
target_fps: 30
window_length: 128
feet_thre: 0.002

# IMU encoder architecture
input_dim: 9               # 3 acc + 6 rot6d
sensor_num: 6              # 5 real + 1 zero-padded
codes_realLength: 4        # temporal grouping (must match VQ-VAE stride: 2^down_t)
model_dim1: 512
model_dim2: 256
nhead: 4
num_encoder_layers: 4
num_decoder_layers: 3
dropout: 0.1

# loss
recon_loss_weight: 0.001          # official default; CE loss dominates

# frozen VQ-VAE (must match VQ-VAE training config)
nb_code: 512
code_dim: 512
output_emb_width: 512
down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
mu: 0.99
vqvae_checkpoint: checkpoints/ego4o_vqvae/best.pt

# output
output_dir: checkpoints

# wandb
wandb_project: SimplePoser
wandb_run_name: ego4o_encoder
wandb_group: ego4o
