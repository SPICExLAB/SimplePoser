# reproducibility
seed: 42

# training
device: cuda:0
batch_size: 256
num_epochs: 130
learning_rate: 0.001
num_workers: 0
dropout: 0.4

# data configs
add_noise: true

# output directory
output_dir: checkpoints

# model config
target_fps: 60
past_frames: 40
future_frames: 5
total_frames: past_frames + future_frames

# settings
use_global_pose: true
window_length: 300

# wandb
wandb_project: SimplePoser
wandb_run_name: rp_calib_noise
wandb_group: rightpocket